name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: make tidy
      - name: generated queries are current
        run: make sqlc-check
      - name: vet
        run: make vet
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.10
      - name: test
        run: make test
